[package]
name    = "ankurah-commons-mint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# A tool, never a library to depend on: it stays unpublished whatever the
# namespaces' crates later become.
publish = false

[dependencies]
ankurah              = { workspace = true }
ankurah-storage-sled = { workspace = true }

ankurah-commons = { path = "..", features = ["full"] }

# The error type the sled store opens with.
anyhow    = "1"
# The state files' encoding: the version Ankurah encodes its own values with.
bincode   = "=1.3.3"
clap      = { version = "4", features = ["derive"] }
tempfile  = "3"
thiserror = "2"
tokio     = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# A test makes a FIFO, which the standard library cannot.
libc        = "0.2"
# The guard on the list of models reads the namespaces' sources.
syn         = { version = "2", features = ["full"] }
