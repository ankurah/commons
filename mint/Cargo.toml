[package]
name    = "ankurah-commons-mint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# A tool for this repository: it writes the kept mint into the crate's sources.
publish = false

[dependencies]
ankurah = { workspace = true }

ankurah-commons = { path = "..", features = ["full"] }

clap      = { version = "4", features = ["derive"] }
# The nonces of entities a kept mint does not hold.
rand      = "0.9"
thiserror = { workspace = true }

[dev-dependencies]
# The guard on the list of models reads the namespaces' sources.
syn      = { version = "2", features = ["full"] }
tempfile = "3"
