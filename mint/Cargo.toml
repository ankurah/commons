[package]
name    = "ankurah-commons-mint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# A tool for this repository: it writes the kept mint into the crate's sources.
publish = false

[dependencies]
ankurah = { workspace = true }

ankurah-commons = { path = "..", features = ["full"] }

clap        = { version = "4", features = ["derive"] }
# Where in a struct's source its model's id is declared.
proc-macro2 = { version = "1", features = ["span-locations"] }
# The nonces of entities a kept mint does not hold.
rand        = "0.9"
syn         = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
