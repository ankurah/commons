[package]
name    = "ankurah-commons"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# Not yet: crates.io refuses git dependencies, and this builds against an unreleased
# revision of Ankurah.
publish = false

[features]
default   = ["identity"]
full      = ["identity", "records", "health", "text", "git", "graph", "cognition", "work", "messaging"]
identity  = []
records   = ["identity"]
health    = ["identity"]
text      = []
git       = []
graph     = []
cognition = []
work      = []
messaging = []
# Conversions between `property::Timestamp` and `jiff::Timestamp`.
jiff      = ["dep:jiff"]

[dependencies]
ankurah   = { workspace = true }
jiff      = { workspace = true, optional = true }
serde     = { workspace = true }
strum     = { workspace = true }

[dev-dependencies]
# Registration by a node that a declaration is sent to, to compare the mint with.
ankurah-connector-local-process = { workspace = true }
ankurah-storage-sled   = { workspace = true }
ankurah-storage-sqlite = { workspace = true }
serde_json             = "1"
# The guard on the list of models reads the namespaces' sources.
syn                    = { workspace = true }
tempfile               = { workspace = true }
tokio                  = { version = "1", features = ["macros", "rt"] }

[workspace]
resolver = "2"
members  = ["mint"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Ankurah's branch `fwd-pin/portable-genesis`: its main at 5919b1a0, and a node that imports
# events made outside it. An application that uses this crate pins the same revision: crates
# from two revisions would not share Ankurah's types.
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "22c997d27f50466ab5b9559ddf00c631842cf4d7", features = ["derive"] }
ankurah-connector-local-process = { git = "https://github.com/ankurah/ankurah", rev = "22c997d27f50466ab5b9559ddf00c631842cf4d7" }
ankurah-storage-sled = { git = "https://github.com/ankurah/ankurah", rev = "22c997d27f50466ab5b9559ddf00c631842cf4d7" }
ankurah-storage-sqlite = { git = "https://github.com/ankurah/ankurah", rev = "22c997d27f50466ab5b9559ddf00c631842cf4d7" }
jiff      = { version = "0.2", default-features = false, features = ["std"] }
serde     = { version = "1", features = ["derive"] }
strum     = { version = "0.26", features = ["derive"] }
syn       = { version = "2", features = ["full"] }
tempfile  = "3"
thiserror = "2"
