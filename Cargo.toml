[package]
name    = "ankurah-commons"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# Not yet: crates.io refuses git dependencies, and this builds against an unreleased
# revision of Ankurah.
publish = false

[features]
default         = ["identity"]
full            = ["identity", "records", "health", "highlights", "git", "intention-graph", "messaging"]
identity        = []
records         = ["identity"]
health          = ["identity"]
highlights      = []
git             = []
intention-graph = ["identity"]
messaging       = ["highlights", "intention-graph"]

[dependencies]
ankurah = { workspace = true }
serde   = { workspace = true }
strum   = { workspace = true }

[workspace]
resolver = "2"
# mint/ needs Ankurah's node identity branch, which is not on Ankurah's main yet: see mint/README.md.
exclude  = ["mint"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# A revision of Ankurah's main. An application that uses this crate pins the same revision:
# crates from two revisions would not share Ankurah's types.
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda", features = ["derive"] }
ankurah-storage-sled = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda" }
serde   = { version = "1", features = ["derive"] }
strum   = { version = "0.26", features = ["derive"] }
