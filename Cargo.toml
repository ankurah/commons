[package]
name    = "ankurah-commons"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# Not yet: crates.io refuses git dependencies, and this builds against an unreleased
# revision of Ankurah.
publish = false

[features]
default   = ["identity"]
full      = ["identity", "records", "health", "text", "git", "graph", "cognition", "work", "messaging"]
identity  = []
records   = ["identity"]
health    = ["identity"]
text      = []
git       = []
graph     = []
cognition = []
work      = []
messaging = []
# Conversions between `property::Timestamp` and `jiff::Timestamp`.
jiff      = ["dep:jiff"]

[dependencies]
ankurah   = { workspace = true }
jiff      = { workspace = true, optional = true }
serde     = { workspace = true }
strum     = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ankurah-storage-sled = { workspace = true }
serde_json           = "1"
tokio                = { version = "1", features = ["macros", "rt"] }

[workspace]
resolver = "2"
members  = ["mint"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Ankurah's branch `fwd-pin/portable-genesis`: its main at 5919b1a0, and a node that imports
# events made outside it. An application that uses this crate pins the same revision: crates
# from two revisions would not share Ankurah's types.
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "42e754d5900f6aa1feb73c1e4997aa2dce0b042e", features = ["derive"] }
ankurah-storage-sled = { git = "https://github.com/ankurah/ankurah", rev = "42e754d5900f6aa1feb73c1e4997aa2dce0b042e" }
jiff      = { version = "0.2", default-features = false, features = ["std"] }
serde     = { version = "1", features = ["derive"] }
strum     = { version = "0.26", features = ["derive"] }
thiserror = "2"
