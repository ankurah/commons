[package]
name    = "ankurah-commons"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# Not yet: crates.io refuses git dependencies, and this builds against an unreleased
# revision of Ankurah.
publish = false

[features]
default         = ["identity"]
full            = ["identity", "records", "health", "text", "git", "graph", "intention-graph", "messaging"]
identity        = []
records         = ["identity"]
health          = ["identity"]
text            = []
git             = []
graph           = []
intention-graph = ["identity"]
messaging       = ["text", "graph", "intention-graph"]
# Conversions between `property::Timestamp` and `jiff::Timestamp`.
jiff            = ["dep:jiff"]

[dependencies]
ankurah = { workspace = true }
jiff    = { workspace = true, optional = true }
serde   = { workspace = true }
strum   = { workspace = true }

[dev-dependencies]
serde_json = "1"

[workspace]
resolver = "2"
# mint/ needs Ankurah's node identity branch, which is not on Ankurah's main yet: see mint/README.md.
exclude  = ["mint"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# A revision of Ankurah's main. An application that uses this crate pins the same revision:
# crates from two revisions would not share Ankurah's types.
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "5919b1a06b5c3e462597d4627521354f9052f4bb", features = ["derive"] }
ankurah-storage-sled = { git = "https://github.com/ankurah/ankurah", rev = "5919b1a06b5c3e462597d4627521354f9052f4bb" }
jiff    = { version = "0.2", default-features = false, features = ["std"] }
serde   = { version = "1", features = ["derive"] }
strum   = { version = "0.26", features = ["derive"] }
